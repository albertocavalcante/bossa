name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: "1.59.0"
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Workflow linting
  workflow-lint:
    runs-on: ubuntu-24.04
    name: Workflow Lint
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install linters
        run: |
          go install github.com/suzuki-shunsuke/ghalint/cmd/ghalint@v1.6.0
          go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.2

      - name: Verify workflows and action pins
        run: sh tools/scripts/check-actions.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test action validator failures
        run: bash tools/scripts/check-actions-test.sh

  # Fast checks that don't need dependencies
  quick-checks:
    runs-on: ubuntu-24.04
    name: Quick Checks
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable (untagged commit; no version tag)
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install just
        run: |
          cargo install just --version "$JUST_VERSION" --locked
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: just fmt-check

      - name: Run Clippy
        run: just lint

  # Tests run in parallel on multiple platforms
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: macos

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.name }})
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable (untagged commit; no version tag)
        with:
          toolchain: 1.99.1

      - name: Cache Cargo
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-test-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-

      - name: Install just
        run: |
          cargo install just --version "$JUST_VERSION" --locked
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: just test

  # Doc check
  docs:
    runs-on: ubuntu-24.04
    name: Docs
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable (untagged commit; no version tag)
        with:
          toolchain: 1.99.1

      - name: Cache Cargo
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-docs-
            ${{ runner.os }}-${{ runner.arch }}-cargo-v2-1.99.1-

      - name: Install just
        run: |
          cargo install just --version "$JUST_VERSION" --locked
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: just doc-check

  msrv:
    runs-on: ubuntu-24.04
    name: Minimum Rust (1.90.0)
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1 # stable (untagged commit; no version tag)
        with:
          toolchain: 1.99.1

      - name: Install minimum Rust
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Install just
        run: |
          cargo install just --version "$JUST_VERSION" --locked
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Check minimum Rust
        run: just msrv
