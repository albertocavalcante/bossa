[package]
name = "bossa-sdk"
version = "0.1.2"
authors = ["Alberto Cavalcante"]
edition = "2024"
license = "MIT"
repository = "https://github.com/albertocavalcante/bossa"
rust-version = "1.90"
description = "Application and setup libraries for Bossa"

[dependencies]
anyhow = "1"
blake3 = "1"
declarative = { path = "../declarative" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "process"] }

[lints]
workspace = true
