[package]
name = "bossa-sdk"
version = "0.1.2"
authors = ["Alberto Cavalcante"]
edition = "2024"
license = "MIT"
repository = "https://github.com/albertocavalcante/bossa"
rust-version = "1.90"
description = "Application and setup libraries for Bossa"

[features]
default = ["native"]
native = [
  "dep:blake3",
  "dep:bossa-process",
  "dep:declarative",
  "dep:dirs",
  "dep:tempfile",
  "dep:thiserror",
  "dep:rustix",
]

[dependencies]
anyhow = "1"
blake3 = { version = "1", optional = true }
bossa-process = { path = "../bossa-process", optional = true }
declarative = { path = "../declarative", optional = true }
dirs = { version = "6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = { version = "3", default-features = false, features = ["base-0"] }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["fs", "process"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "configured_setup"
required-features = ["native"]
